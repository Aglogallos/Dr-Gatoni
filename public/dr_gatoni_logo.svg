<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circle Background -->
  <circle cx="50" cy="50" r="48" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/>
  
  <!-- Cat ears -->
  <path d="M28 36 L15 12 L38 25 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
  <path d="M72 36 L85 12 L62 25 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
  <path d="M30 33 L21 17 L36 26 Z" fill="#FEE2E2" />
  <path d="M70 33 L79 17 L64 26 Z" fill="#FEE2E2" />
  
  <!-- Cat Head -->
  <ellipse cx="50" cy="49" rx="28" ry="23" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
  
  <!-- Cat Eyes -->
  <circle cx="39" cy="44" r="5" fill="#1E293B"/>
  <circle cx="61" cy="44" r="5" fill="#1E293B"/>
  
  <!-- Eye Highlights -->
  <circle cx="37.5" cy="42.5" r="1.5" fill="white"/>
  <circle cx="59.5" cy="42.5" r="1.5" fill="white"/>
  
  <!-- Cat Glasses -->
  <circle cx="39" cy="44" r="8" stroke="#1E293B" stroke-width="2" fill="none"/>
  <circle cx="61" cy="44" r="8" stroke="#1E293B" stroke-width="2" fill="none"/>
  <line x1="47" y1="44" x2="53" y2="44" stroke="#1E293B" stroke-width="2"/>
  <line x1="27" y1="42" x2="31" y2="44" stroke="#1E293B" stroke-width="2"/>
  <line x1="73" y1="42" x2="69" y2="44" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Snout & Nose -->
  <ellipse cx="50" cy="53" rx="6" ry="4" fill="#FEE2E2"/>
  <polygon points="48,51.5 52,51.5 50,54" fill="#EF4444"/>
  
  <!-- Cute smile -->
  <path d="M46 55 Q50 58 50 55 C50 58 54 55 54 55" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Whiskers -->
  <line x1="20" y1="51" x2="9" y2="49" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="55" x2="11" y2="56" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="51" x2="91" y2="49" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="55" x2="89" y2="56" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Doctor Collar & Coat -->
  <path d="M32 71 C32 65 37 60 42 60 L58 60 C63 60 68 65 68 71 L70 90 L30 90 Z" fill="white" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Collar fold -->
  <path d="M40 60 L48 70 M60 60 L52 70" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Red cross on pocket/lapel -->
  <rect x="58" y="68" width="6" height="6" rx="1" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.5"/>
  <path d="M61 69 L61 73 M59 71 L63 71" stroke="#EF4444" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Stethoscope around neck -->
  <path d="M35 60 Q35 77 50 79 Q65 77 65 60" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="50" cy="85" r="4.5" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
  <line x1="50" y1="79" x2="50" y2="85" stroke="#475569" stroke-width="2"/>
</svg>
